<!-- WRAPPER GLOBAL -->
<div class="min-h-screen bg-gray-50 flex flex-col">

  <!-- ===== TOP NAVBAR ===== -->
  <header class="bg-neutral-50 backdrop-blur-md border-b border-red-900/20 shadow-2xl sticky top-0 z-50">
    <div class="max-w-[1400px] mx-auto px-6 py-4 flex justify-between items-center">

      <!-- LOGO : Dynamique avec dégradé subtil -->
      <a [routerLink]="['/']" class="flex items-center space-x-3 group outline-none">
        <div class="relative overflow-hidden bg-red-700 from-gray-900 to-red-600 text-black w-11 h-11 rounded-2xl flex items-center justify-center shadow-xl shadow-red-500/20 group-hover:shadow-red-500/40 group-hover:scale-110 transition-all duration-500">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 transform group-hover:rotate-12 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
        </div>
        <div class="flex flex-col">
        <span class="text-black font-black leading-none tracking-tighter ">
        CV</span>
        </div>
      </a>

      <!-- ACTIONS DROITE : Bouton stylé "Glass-Effect" -->
      <div class="flex items-center">
        <a [routerLink]="['/new']"
           routerLinkActive="bg-red-700 text-black border border-red-100"
           class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-black hover:bg-red-300 hover:text-black transition-all duration-200 font-semibold text-sm group">

          <!-- Icône avec animation -->
          <div class="relative z-10">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
          </div>

          <span class="relative z-10 font-bold text-black tracking-wide">Nouveau CV</span>

          <!-- Overlay brillant au hover -->
          <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
        </a>
      </div>

    </div>
  </header>

  <!-- ===== BODY = SIDEBAR + CONTENT ===== -->
  <div class="flex flex-1 max-w-[1400px] mx-auto w-full px-6 py-8 gap-8">

    <!-- ===== SIDEBAR ===== -->
    <aside class="w-52 flex-shrink-0">
      <div class="bg-neutral-50 border border-red-900/30 rounded-2xl p-4 sticky top-24 shadow-xl">

        <!-- SECTION LABEL -->
        <p class="text-[10px] font-black text-black uppercase tracking-widest px-3 mb-3">Navigation</p>

        <ul class="space-y-1">
          <!-- HOME -->
          <li>
            <a [routerLink]="['/']"
               routerLinkActive="bg-red-700 text-black border border-red-100"
               class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-black hover:bg-red-300 hover:text-black transition-all duration-200 font-semibold text-sm group">
              <div class="w-8 h-8 rounded-lg bg-transparent group-hover:bg-blue-600/20 flex items-center justify-center transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </div>
              <span>Accuiel</span>
            </a>
          </li>
          <li>
            <a [routerLink]="['/cv']"
               routerLinkActive="bg-red-700 text-black border border-red-100"
               class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-black hover:bg-red-300 hover:text-black transition-all duration-200 font-semibold text-sm group">
              <div class="w-8 h-8 rounded-lg bg-transparent group-hover:bg-blue-600/20 flex items-center justify-center transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </div>
              <span>CV</span>
            </a>
          </li>
          <!-- PROFILS -->
          <li>
            <a [routerLink]="['/profils']"
               routerLinkActive="bg-red-700 text-black border border-red-100"
               class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-black hover:bg-red-300 hover:text-black transition-all duration-200 font-semibold text-sm group">
              <div class="w-8 h-8 rounded-lg bg-transparent group-hover:bg-blue-600/20 flex items-center justify-center transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </div>
              <span>Profils</span>
            </a>
          </li>

          <!-- SEPARATEUR -->
          <li class="pt-2 pb-1">
            <p class="text-[10px] font-black text-gray-600 uppercase tracking-widest px-3">Données CV</p>
          </li>

          <!-- LANGUES -->
          <li>
            <a [routerLink]="['/langues']"
               routerLinkActive="bg-red-700 text-black border border-red-100"
               class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-black hover:bg-red-300 hover:text-black transition-all duration-200 font-semibold text-sm group">
              <div class="w-8 h-8 rounded-lg  group-hover:bg-blue-600/20 flex items-center justify-center transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 002 2h1.5a3.5 3.5 0 013.5 3.5V17a4 4 0 11-8 0v-1h-1a2 2 0 01-2-2v-2a2 2 0 00-2-2h-2a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 002-2V3.055" />
                </svg>
              </div>
              <span>Langues</span>
            </a>
          </li>

          <!-- QUALITES -->
          <li>
            <a [routerLink]="['/qualites']"
               routerLinkActive="bg-red-700 text-black border border-red-100"
               class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-black hover:bg-red-300 hover:text-black transition-all duration-200 font-semibold text-sm group">
              <div class="w-8 h-8 rounded-lg bg-white/5 group-hover:bg-yellow-600/20 flex items-center justify-center transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.382-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
                </svg>
              </div>
              <span>Qualités</span>
            </a>
          </li>

          <!-- ETUDES -->
          <li>
            <a [routerLink]="['/etudes']"
               routerLinkActive="bg-red-700 text-black border border-red-100"
               class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-black hover:bg-red-300 hover:text-black transition-all duration-200 font-semibold text-sm group">
              <div class="w-8 h-8 rounded-lg bg-white/5 group-hover:bg-emerald-600/20 flex items-center justify-center transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                </svg>
              </div>
              <span>Etudes</span>
            </a>
          </li>

          <!-- EXPERIENCES -->
          <li>
            <a [routerLink]="['/experiences']"
               routerLinkActive="bg-red-700 text-black border border-red-100"
               class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-black hover:bg-red-300 hover:text-black transition-all duration-200 font-semibold text-sm group">
              <div class="w-8 h-8 rounded-lg bg-white/5 group-hover:bg-purple-600/20 flex items-center justify-center transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
              </div>
              <span>Expériences</span>
            </a>
          </li>

          <!-- COMPETENCES -->
          <li>
            <a [routerLink]="['/competences']"
               routerLinkActive="bg-red-700 text-black border border-red-100"
               class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-black hover:bg-red-300 hover:text-black transition-all duration-200 font-semibold text-sm group">
              <div class="w-8 h-8 rounded-lg bg-white/5 group-hover:bg-indigo-600/20 flex items-center justify-center transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                </svg>
              </div>
              <span>Compétences</span>
            </a>
          </li>

          <!-- LOISIRS -->
          <li>
            <a [routerLink]="['/loisirs']"
               routerLinkActive="bg-red-700 text-black border border-red-100"
               class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-black hover:bg-red-300 hover:text-black transition-all duration-200 font-semibold text-sm group">
              <div class="w-8 h-8 rounded-lg bg-white/5 group-hover:bg-pink-600/20 flex items-center justify-center transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </div>
              <span>Loisirs</span>
            </a>
          </li>

        </ul>

        <!-- VERSION -->
        <div class="mt-6 pt-4 border-t border-red-700 px-3">
          <p class="text-[12px] text-black font-bold uppercase tracking-widest">CV  v1.0.0</p>
          <p class="text-[12px] text-black">Talesy</p>
        </div>

      </div>
    </aside>

    <!-- ===== CONTENU PRINCIPAL ===== -->
    <main class="flex-1 min-w-0">
      <!-- Le fond de la zone de contenu reste blanc pour une lisibilité maximale des données -->
      <div class="bg-white rounded-3xl min-h-[calc(100vh-180px)] overflow-hidden shadow-sm border border-red-100/50">
        <router-outlet></router-outlet>
      </div>
    </main>

  </div>



</div>
